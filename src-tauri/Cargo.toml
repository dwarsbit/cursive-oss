[package]
name = "cursive"
version = "0.4.1"
description = "Cursive - a Markdown editor for notes, presentations and tutorials"
authors = ["Leon"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name from clashing with the bin name
# on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cursive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
percent-encoding = "2"
tokio = { version = "1", features = ["sync", "time"] }

# Printing to PDF with no print window (src/pdf.rs), through each system's webview.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "=2.0.2"

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6"

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3"
default-features = false
features = ["std", "NSString", "NSURL", "NSDictionary", "NSGeometry", "NSObject"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3"
default-features = false
features = ["std", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-web-kit]
version = "0.3"
default-features = false
features = ["std", "objc2-app-kit", "WKWebView"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
