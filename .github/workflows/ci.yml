name: CI

# Scholarkit's Mirror workflow starts it after each commit it pushes here, to main or to a
# scholarkit/<branch> (a push from a workflow starts no workflows by itself). Pull requests
# here start it too.
on:
  pull_request:
  workflow_dispatch:

# A new push to a pull request or a scholarkit/ branch cancels its older
# runs. Runs on main get a group of their own and always finish: a release
# needs main green.
concurrency:
  group: ci-${{ github.ref != 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # The desktop app's build and the browser's.
      - name: Build
        run: pnpm build

  # Its own job, so a package mirror that doesn't answer can't hide the
  # result of the checks above.
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the build dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libdbus-1-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check the desktop app
        working-directory: src-tauri
        run: cargo check

      - name: Desktop app tests
        working-directory: src-tauri
        run: cargo test
